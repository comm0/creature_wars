name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCREATURE_WARS_BUILD_APP=OFF
          -DCREATURE_WARS_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Core / ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-rt-18-dev ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCREATURE_WARS_BUILD_APP=OFF
          -DCREATURE_WARS_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cppcheck ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCREATURE_WARS_BUILD_APP=OFF
          -DCREATURE_WARS_WARNINGS_AS_ERRORS=ON
          -DCREATURE_WARS_ENABLE_CLANG_TIDY=ON
          -DCREATURE_WARS_ENABLE_CPPCHECK=ON
          -DBUILD_TESTING=OFF

      - name: Analyze
        run: cmake --build build --target creature_wars_core --parallel
